[package]
name = "privacy-pay"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "privacy_pay"

[workspace]

[features]
idl-build = ["anchor-lang/idl-build"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
custom-heap = []
custom-panic = []
anchor-debug = []
default = []

[dependencies]
anchor-lang = "0.32.1"
anyhow = "1.0.100"
solana-sdk = "2.2"

# Light Protocol - Compressed State Support (75% storage savings)
light-sdk = "0.13.0"
light-sdk-macros = "0.13.0"
light-macros = "2.1.0"
light-sdk-types = "0.13.0"
light-hasher = "3.1.0"
